[tox]
envlist = py311, py312, py313, lint, type, coverage
skip_missing_interpreters = true

[testenv]
description = Run unit tests
deps = -r{toxinidir}/requirements-dev.txt
commands =
    pytest {posargs:tests/}

[testenv:py311]
basepython = python3.11

[testenv:py312]
basepython = python3.12

[testenv:py313]
basepython = python3.13

[testenv:lint]
description = Run linting checks (black, isort, flake8)
skip_install = true
deps =
    black>=23.7.0
    isort>=5.12.0
    flake8>=6.0.0
commands =
    black --check src/ tests/
    isort --check-only src/ tests/
    flake8 src/ tests/ --max-line-length=88 --extend-ignore=E203,W503

[testenv:format]
description = Auto-format code with black and isort
skip_install = true
deps =
    black>=23.7.0
    isort>=5.12.0
commands =
    black src/ tests/
    isort src/ tests/

[testenv:type]
description = Run type checking with mypy
deps =
    mypy>=1.4.1
    types-requests
    types-PyYAML
commands =
    mypy src/ --ignore-missing-imports

[testenv:coverage]
description = Run tests with coverage report
deps = -r{toxinidir}/requirements-dev.txt
commands =
    pytest --cov=src --cov-report=html --cov-report=term-missing {posargs}

[testenv:clean]
description = Clean up temporary files
skip_install = true
allowlist_externals = find
commands =
    find . -type d -name __pycache__ -exec rm -rf {{}} + 2>/dev/null || true
    find . -type d -name .pytest_cache -exec rm -rf {{}} + 2>/dev/null || true
    find . -type d -name .mypy_cache -exec rm -rf {{}} + 2>/dev/null || true
    find . -type d -name htmlcov -exec rm -rf {{}} + 2>/dev/null || true
    find . -type f -name .coverage -delete 2>/dev/null || true

[testenv:ci]
description = Run all CI checks (lint, type, test, coverage)
deps = -r{toxinidir}/requirements-dev.txt
commands =
    black --check src/ tests/
    isort --check-only src/ tests/
    flake8 src/ tests/ --max-line-length=88
    mypy src/ --ignore-missing-imports
    pytest --cov=src --cov-report=term-missing

[pytest]
testpaths = tests
python_files = test_*.py
addopts = -v --tb=short

[coverage:run]
branch = true
omit =
    */tests/*
    */site-packages/*
    */.tox/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
precision = 2
